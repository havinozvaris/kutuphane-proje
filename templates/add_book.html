{% extends "base.html" %}
{% block title %}Yeni Kitap Ekle{% endblock %}
{% block topbar_title %}Kitap Yönetimi{% endblock %}

{% block content %}
<div class="custom-toolbar">
  <div class="toolbar-left-group">
    <div style="font-weight: 800; font-size: 18px; white-space: nowrap;">➕ Yeni Kitap Ekle</div>
  </div>
  <a href="{{ url_for('books') }}" class="btn" style="background: #f1f5f9; color: #475569;">⬅️ Listeye Dön</a>
</div>

<div class="card" style="max-width: 800px; margin: 0 auto; padding: 30px;">
    <h3 style="margin-bottom: 20px;">Kitap Bilgilerini Girin</h3>
    <form action="{{ url_for('add_book') }}" method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Kitap Adı *</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group">
                <label>Yazar *</label>
                <input type="text" name="author" required>
            </div>
            <div class="form-group">
                <label>ISBN No *</label>
                <input type="text" name="isbn" required>
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <select name="category" required>
                    <option value="Roman">Roman</option>
                    <option value="Tarih">Tarih</option>
                    <option value="Klasik">Klasik</option>
                    <option value="Dystopia">Dystopia</option>
                </select>
            </div>
            <div class="form-group">
                <label>Basım Yılı</label>
                <input type="number" name="year">
            </div>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 25px; padding: 15px;">💾 Kitabı Kaydet</button>
    </form>
</div>
{% endblock %}
