{% extends "base.html" %}

{% block title %}Kitap Düzenle{% endblock %}
{% block topbar_title %}Kitap Düzenle{% endblock %}

{% block content %}

<div class="custom-toolbar">
    <div style="font-weight:800;font-size:18px;">
        ✏️ Kitap Düzenle
    </div>

    <a href="{{ url_for('books') }}" class="btn"
       style="background:#f1f5f9;color:#475569;">
        ⬅️ Listeye Dön
    </a>
</div>

<div class="card" style="max-width:800px;margin:auto;padding:30px;">

<form method="POST">

    <div class="form-group">
        <label>Kitap Adı</label>
        <input type="text" name="title" value="{{ book.title }}" required>
    </div>

    <div class="form-group">
        <label>Yazar</label>
        <input type="text" name="author" value="{{ book.author }}" required>
    </div>

    <div class="form-group">
        <label>ISBN</label>
        <input type="text" name="isbn" value="{{ book.isbn }}" required>
    </div>

    <div class="form-group">
        <label>Kategori</label>

        <select name="category">

            <option value="Roman"
            {% if book.category=="Roman" %}selected{% endif %}>
            Roman
            </option>

            <option value="Tarih"
            {% if book.category=="Tarih" %}selected{% endif %}>
            Tarih
            </option>

            <option value="Klasik"
            {% if book.category=="Klasik" %}selected{% endif %}>
            Klasik
            </option>

            <option value="Dystopia"
            {% if book.category=="Dystopia" %}selected{% endif %}>
            Dystopia
            </option>

        </select>

    </div>

    <div class="form-group">
        <label>Basım Yılı</label>

        <input
            type="number"
            name="year"
            value="{{ book.year }}"
        >

    </div>

    <button class="btn" type="submit">
        💾 Değişiklikleri Kaydet
    </button>

</form>

</div>

{% endblock %}
