<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibraryOS - Kütüphane Yönetimi</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FC;
        }

        /* SIDEBAR TASARIMI */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #4B2CB9;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar-brand {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
        }

        .nav-link {
            color: rgba(255,255,255,0.7) !important;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: 600;
            display: block;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: white !important;
            background-color: #5D3FD3;
        }

        .nav-link.active {
            color: white !important;
            background-color: #5D3FD3;
            border-left: 4px solid #00D27B;
        }

        /* İÇERİK ALANI */
        .main-content {
            margin-left: 250px;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">LibraryOS</div>

        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
            Dashboard
        </a>

        <a href="/kitaplar" class="nav-link {% if request.path == '/kitaplar' %}active{% endif %}">
            Kitaplar
        </a>

        <a href="/uyeler" class="nav-link {% if request.path == '/uyeler' %}active{% endif %}">
            Üyeler
        </a>

        <a href="/odunc-ver" class="nav-link {% if request.path == '/odunc-ver' %}active{% endif %}">
            Ödünç Ver
        </a>

        <a href="/iade-al" class="nav-link {% if request.path == '/iade-al' %}active{% endif %}">
            İade Al
        </a>
    </div>

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
