<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LibraryOS · Giriş</title>

    <style>
        body{
            margin:0;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
            background:#f3f5ff;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:440px;
            background:white;
            padding:28px;
            border-radius:26px;
            box-shadow:0 18px 50px rgba(0,0,0,0.08);
        }

        h1{
            color:#201063;
            font-size:32px;
            margin:0 0 6px;
        }

        .subtitle{
            color:#666;
            font-size:14px;
            margin-bottom:24px;
        }

        input[type="radio"]{
            display:none;
        }

        .tabs{
            display:flex;
            width:100%;
            height:52px;
            border:1px solid #ddd;
            border-radius:16px;
            overflow:hidden;
            margin-bottom:22px;
            background:#fff;
        }

        .tabs label{
            flex:1;
            height:100%;
            margin:0 !important;
            padding:0 !important;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:8px;
            font-size:16px;
            font-weight:800;
            color:#201063;
            cursor:pointer;
            transition:0.2s ease;
        }

        #admin:checked ~ .tabs label[for="admin"],
        #member:checked ~ .tabs label[for="member"]{
            background:linear-gradient(135deg,#6847ff,#9856ff);
            color:white;
        }

        .form-area{
            display:none;
            border:1px solid #e2e6ff;
            padding:22px;
            border-radius:18px;
        }

        #admin:checked ~ .admin-form{
            display:block;
        }

        #member:checked ~ .member-form{
            display:block;
        }

        h2{
            margin:0 0 18px;
            color:#201063;
            font-size:22px;
        }

        .form-area label{
            display:block;
            font-weight:700;
            color:#201063;
            margin-top:12px;
            margin-bottom:7px;
            font-size:14px;
        }

        input:not([type="radio"]){
            width:100%;
            padding:12px;
            border:1.5px solid #dfe3f5;
            border-radius:14px;
            font-size:15px;
            box-sizing:border-box;
            outline:none;
            transition:0.2s;
        }

        input:not([type="radio"]):focus{
            border-color:#6847ff;
            box-shadow:0 0 0 4px rgba(104,71,255,0.10);
        }

        button{
            margin-top:24px;
            width:100%;
            border:none;
            padding:13px;
            border-radius:14px;
            background:linear-gradient(135deg,#6847ff,#9856ff);
            color:white;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
        }

        .register{
            margin-top:22px;
            text-align:center;
            font-size:15px;
            color:#666;
        }

        .register a{
            color:#6847ff;
            font-weight:800;
            text-decoration:none;
        }

        .error{
            background:#ffecec;
            color:#c0392b;
            padding:12px;
            border-radius:12px;
            margin-bottom:18px;
            font-weight:700;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h1>LibraryOS</h1>
    <div class="subtitle">Admin veya üye olarak giriş yapın</div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="radio" name="login_type" id="admin" value="admin" checked>
        <input type="radio" name="login_type" id="member" value="member">

        <div class="tabs">
            <label for="admin">🛡️ Admin</label>
            <label for="member">👤 Üye</label>
        </div>

        <div class="form-area admin-form">
            <h2>🛡️ Admin Girişi</h2>

            <label>Kullanıcı Adı</label>
            <input type="text" name="admin_username" placeholder="admin">

            <label>Şifre</label>
            <input type="password" name="admin_password" placeholder="admin123">

            <button type="submit">Giriş Yap</button>
        </div>

        <div class="form-area member-form">
            <h2>👤 Üye Girişi</h2>

            <label>E-posta Adresi</label>
            <input type="email" name="member_email" placeholder="ornek@email.com">

            <label>Şifre</label>
            <input type="password" name="member_password" placeholder="Şifrenizi girin">

            <button type="submit">Giriş Yap</button>
        </div>
    </form>

    <div class="register">
        Hesabın yok mu?
        <a href="{{ url_for('register') }}">Kayıt Ol</a>
    </div>
</div>

</body>
</html>
