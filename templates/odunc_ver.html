<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LibraryOS - Ödünç Ver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h2>📚 LibraryOS</h2>
                <p>Kütüphane Sistemi</p>
            </div>
            <nav class="menu">
                <a href="/">🏠 Dashboard</a>
                <a href="/kitaplar">📖 Kitaplar</a>
                <a href="#">👤 Üyeler</a>
                <a href="/odunc-ver" class="active">🔄 Ödünç Ver</a>
                <a href="/iade-al">↩️ İade Al</a>
                <a href="#">📊 Raporlar</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Kitap Ödünç Ver</h1>
                <p>LibraryOS · Python Tabanlı Kütüphane Yönetim Sistemi</p>
            </header>

            <form action="/odunc-ver" method="POST" class="odunc-form-alani">
                <div class="odunc-ana-grid">
                    
                    <div class="odunc-kart">
                        <div class="odunc-kart-ust"><span class="odunc-sayi">1</span> Kitap Seçimi</div>
                        <div class="odunc-kart-ic">
                            <select name="kitap_adi" id="js-kitap-sec" required class="odunc-select">
                                <option value="">Kitap seçiniz...</option>
                                {% for kitap in kitaplar %}
                                    <option value="{{ kitap.ad }}">{{ kitap.ad }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="odunc-kart">
                        <div class="odunc-kart-ust"><span class="odunc-sayi">2</span> Üye Seçimi</div>
                        <div class="odunc-kart-ic odunc-liste">
                            {% for uye in uyeler %}
                            <label class="odunc-uye-satir">
                                <input type="radio" name="uye_adi" value="{{ uye.ad }}" required>
                                <div class="odunc-uye-ikon">{{ uye.ad[0] }}</div>
                                <div class="odunc-uye-bilgi">
                                    <strong>{{ uye.ad }}</strong>
                                    <span>{{ uye.email }}</span>
                                </div>
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="odunc-kart">
                        <div class="odunc-kart-ust"><span class="odunc-sayi">3</span> İade Tarihi & Onay</div>
                        <div class="odunc-kart-ic">
                            <label class="odunc-etiket">İADE TARİHİ</label>
                            <input type="date" name="tarih" id="js-tarih-sec" required class="odunc-select">
                            
                            <div class="odunc-ozet-kutusu">
                                <span class="odunc-ozet-baslik">İŞLEM ÖZETİ</span>
                                <div class="odunc-ozet-satir"><span>Kitap:</span> <span id="js-ozet-kitap">--</span></div>
                                <div class="odunc-ozet-satir"><span>Üye:</span> <span id="js-ozet-uye">--</span></div>
                                <div class="odunc-ozet-satir odunc-vurgu"><span>İade:</span> <span id="js-ozet-tarih">--</span></div>
                            </div>

                            <button type="submit" class="odunc-buton">📖 Kitabı Ödünç Ver</button>
                        </div>
                    </div>

                </div>
            </form>
        </main>
    </div>

    <script>
        const kInput = document.getElementById('js-kitap-sec');
        const tInput = document.getElementById('js-tarih-sec');
        const uRadios = document.querySelectorAll('input[name="uye_adi"]');

        kInput.addEventListener('change', () => {
            document.getElementById('js-ozet-kitap').innerText = kInput.value || "--";
        });

        uRadios.forEach(r => {
            r.addEventListener('change', () => {
                document.getElementById('js-ozet-uye').innerText = r.value;
            });
        });

        tInput.addEventListener('input', () => {
            document.getElementById('js-ozet-tarih').innerText = tInput.value || "--";
        });
    </script>
</body>
</html>
