{% extends "base.html" %}
{% block title %}Ödünç Ver{% endblock %}
{% block topbar_title %}Kitap Ödünç Ver{% endblock %}

{% block content %}
<div class="odunc-ana-grid">
    <div class="odunc-kart">
        <div class="odunc-kart-ust"><span class="odunc-sayi">1</span> Ödünç Verme Formu</div>
        <div class="odunc-kart-ic">
            <form action="{{ url_for('add_loan') }}" method="POST">
                <div class="form-group">
                    <label>Kitap Seç *</label>
                    <select name="book_id" required class="odunc-select">
                        <option value="">-- Kitap seçiniz --</option>
                        {% for kitap in available_books %}
                            <option value="{{ kitap.id }}">{{ kitap.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group" style="margin-top:15px;">
                    <label>Üye Seç *</label>
                    <select name="member_id" required class="odunc-select">
                        <option value="">-- Üye seçiniz --</option>
                        {% for uye in all_members %}
                            <option value="{{ uye.id }}">{{ uye.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="odunc-buton" style="margin-top:20px;">📖 Ödünç Ver</button>
            </form>
        </div>
    </div>

    <div class="odunc-kart">
        <div class="odunc-kart-ust"><span class="odunc-sayi">2</span> Özet</div>
        <div class="odunc-kart-ic">
            <div class="odunc-ozet-kutusu">
                <p>Tarih: <strong>{{ now }}</strong></p>
            </div>
            <p style="font-size:13px; color:var(--text-soft);">
                İade işlemleri için <b>İade Al</b> sayfasını kullanın.
            </p>
        </div>
    </div>
</div>
{% endblock %}
