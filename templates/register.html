<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LibraryOS · Kayıt Ol</title>

    <style>
        body{
            margin:0;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
            background:#f3f5ff;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-card{
            width:440px;
            background:white;
            padding:32px;
            border-radius:24px;
            box-shadow:0 18px 50px rgba(0,0,0,0.08);
        }

        h1{
            color:#201063;
            font-size:32px;
            margin-bottom:6px;
            font-weight:800;
        }

        .subtitle{
            color:#666;
            font-size:16px;
            margin-bottom:24px;
        }

        label{
            display:block;
            font-weight:700;
            color:#201063;
            margin-bottom:8px;
            font-size:15px;
        }

        .form-group{
            margin-bottom:16px;
        }

        input{
            width:100%;
            padding:13px 15px;
            border:1.5px solid #dfe3f5;
            border-radius:14px;
            font-size:15px;
            box-sizing:border-box;
            outline:none;
            transition:0.2s;
        }

        input:focus{
            border-color:#7a5cff;
            box-shadow:0 0 0 4px rgba(122,92,255,0.12);
        }

        input::placeholder{
            color:#aaa;
        }

        button{
            margin-top:8px;
            width:100%;
            border:none;
            padding:15px;
            border-radius:16px;
            background:linear-gradient(135deg,#6847ff,#9856ff);
            color:white;
            font-size:17px;
            font-weight:800;
            cursor:pointer;
            transition:0.2s;
        }

        button:hover{
            transform:translateY(-2px);
            opacity:0.96;
        }

        .login-link{
            margin-top:22px;
            text-align:center;
            font-size:16px;
            color:#555;
        }

        .login-link a{
            color:#6847ff;
            font-weight:800;
            text-decoration:none;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .error{
            background:#ffecec;
            color:#c0392b;
            padding:12px;
            border-radius:12px;
            margin-bottom:18px;
            font-weight:700;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <h1>Kayıt Ol</h1>
    <p class="subtitle">
        Üye hesabı oluşturmak için bilgilerinizi girin.
    </p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label>Ad Soyad</label>
            <input type="text"
                   name="name"
                   placeholder="Adınızı ve soyadınızı girin"
                   required>
        </div>

        <div class="form-group">
            <label>E-posta</label>
            <input type="email"
                   name="email"
                   placeholder="ornek@email.com"
                   required>
        </div>

        <div class="form-group">
            <label>Telefon Numarası</label>
            <input type="text"
                   name="phone"
                   placeholder="05XX XXX XX XX"
                   required>
        </div>

        <div class="form-group">
            <label>Şifre</label>
            <input type="password"
                   name="password"
                   placeholder="Şifrenizi girin"
                   required>
        </div>

        <button type="submit">
            Kayıt Ol
        </button>

    </form>

    <div class="login-link">
        Zaten hesabın var mı?
        <a href="{{ url_for('login') }}">Giriş Yap</a>
    </div>

</div>

</body>
</html>
