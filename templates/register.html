<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LibraryOS · Kayıt Ol</title>

    <style>
        body{
            margin:0;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
            background:#f3f5ff;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-card{
            width:430px;
            background:white;
            padding:28px;
            border-radius:24px;
            box-shadow:0 18px 50px rgba(0,0,0,0.08);
        }

        h1{
            color:#201063;
            font-size:30px;
            margin-bottom:6px;
            font-weight:800;
        }

        .subtitle{
            color:#666;
            font-size:14px;
            margin-bottom:22px;
        }

        label{
            display:block;
            font-weight:700;
            color:#201063;
            margin-bottom:7px;
            font-size:14px;
        }

        .form-group{
            margin-bottom:14px;
        }

        input{
            width:100%;
            padding:12px 14px;
            border:1.5px solid #dfe3f5;
            border-radius:14px;
            font-size:14px;
            box-sizing:border-box;
            outline:none;
            transition:0.2s;
        }

        input:focus{
            border-color:#7a5cff;
            box-shadow:0 0 0 4px rgba(122,92,255,0.12);
        }

        input::placeholder{
            color:#aaa;
        }

        button{
            margin-top:6px;
            width:100%;
            border:none;
            padding:13px;
            border-radius:15px;
            background:linear-gradient(135deg,#6847ff,#9856ff);
            color:white;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
            transition:0.2s;
        }

        button:hover{
            transform:translateY(-1px);
            opacity:0.96;
        }

        .login-link{
            margin-top:18px;
            text-align:center;
            font-size:15px;
            color:#555;
        }

        .login-link a{
            color:#6847ff;
            font-weight:800;
            text-decoration:none;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .error{
            background:#ffecec;
            color:#c0392b;
            padding:11px;
            border-radius:12px;
            margin-bottom:16px;
            font-weight:700;
            font-size:13px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <h1>Kayıt Ol</h1>

    <p class="subtitle">
        Üye hesabı oluşturmak için bilgilerinizi girin.
    </p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label>Kullanıcı Adı</label>

            <input
                type="text"
                name="username"
                placeholder="Kullanıcı adı girin"
                minlength="3"
                maxlength="20"
                required
            >
        </div>

        <div class="form-group">
            <label>Ad Soyad</label>

            <input
                type="text"
                name="name"
                placeholder="Adınızı ve soyadınızı girin"
                minlength="3"
                maxlength="50"
                required
            >
        </div>

        <div class="form-group">
            <label>E-posta</label>

            <input
                type="email"
                name="email"
                placeholder="ornek@email.com"
                maxlength="100"
                required
            >
        </div>

        <div class="form-group">
            <label>Telefon Numarası</label>

            <input
                type="tel"
                name="phone"
                placeholder="05XXXXXXXXX"
                pattern="[0-9]{10,11}"
                maxlength="11"
                inputmode="numeric"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                required
            >
        </div>

        <div class="form-group">
            <label>Şifre</label>

            <input
                type="password"
                name="password"
                placeholder="En az 6 karakter"
                minlength="6"
                maxlength="30"
                pattern="^\S+$"
                title="Şifre boşluk içeremez"
                required
            >
        </div>

        <div class="form-group">
            <label>Şifre Tekrar</label>

            <input
                type="password"
                name="password_repeat"
                placeholder="Şifrenizi tekrar girin"
                minlength="6"
                maxlength="30"
                pattern="^\S+$"
                title="Şifre boşluk içeremez"
                required
            >
        </div>

        <button type="submit">
            Kayıt Ol
        </button>

    </form>

    <div class="login-link">
        Zaten hesabın var mı?
        <a href="{{ url_for('login') }}">Giriş Yap</a>
    </div>

</div>

</body>
</html>
