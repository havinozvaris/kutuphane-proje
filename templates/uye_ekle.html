{% extends "base.html" %}

{% block title %}Üye Ekle{% endblock %}
{% block topbar_title %}Üye Ekle{% endblock %}

{% block content %}

<div style="max-width:500px;">

  <!-- 🔙 GERİ -->
  <a href="{{ url_for('members') }}" class="btn btn-outline btn-sm">← Geri</a>

  <div class="card" style="padding:30px;margin-top:20px;">

    <!-- ✅ DOĞRU ROUTE -->
    <form method="post" action="{{ url_for('add_member') }}">

      <div class="form-group">
        <label>Ad Soyad</label>
        <input type="text" name="name" required>
      </div>

      <div class="form-group">
        <label>E-posta</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Telefon</label>
        <input type="text" name="phone">
      </div>

      <button class="btn btn-primary">Kaydet</button>

    </form>

  </div>

</div>

{% endblock %}
