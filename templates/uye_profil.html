{% extends "uye_base.html" %}

{% block title %}Profil{% endblock %}

{% block content %}

<style>

.profile-card{
    background:white;
    border-radius:24px;
    padding:40px;
    box-shadow:0 10px 25px rgba(0,0,0,.04);
    max-width:900px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#5b3df5;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:bold;
    margin-bottom:20px;
}

.info{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

.box{
    background:#f4f5ff;
    padding:20px;
    border-radius:16px;
}

.box label{
    font-size:14px;
    opacity:.7;
}

.box p{
    font-size:20px;
    font-weight:bold;
    margin-top:8px;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border-radius:12px;
    border:1px solid #ddd;
}

.btn{
    margin-top:20px;
}

</style>

<div class="profile-card">

    <div class="avatar">
        {{ user.name[0] }}
    </div>

    <h2>{{ user.name }}</h2>
    <p>{{ user.email }}</p>

    <div class="info">

        <div class="box">
            <label>Üye ID</label>
            <p>{{ user.id }}</p>
        </div>

        <div class="box">
            <label>Telefon</label>
            <p>{{ user.phone }}</p>
        </div>

        <div class="box">
            <label>Ödünç Kitap Sayısı</label>
            <p>{{ book_count }}</p>
        </div>

        <div class="box">
            <label>Son Giriş</label>
            <p>{{ last_login }}</p>
        </div>

    </div>

    <form method="POST" action="{{ url_for('sifre_degistir') }}">

        <h3 style="margin-top:35px;">🔒 Şifre Değiştir</h3>

        <input type="password"
               name="old_password"
               placeholder="Eski şifre"
               required>

        <input type="password"
               name="new_password"
               placeholder="Yeni şifre"
               required>

        <button class="btn" type="submit">
            Şifreyi Güncelle
        </button>

    </form>

</div>

{% endblock %}
