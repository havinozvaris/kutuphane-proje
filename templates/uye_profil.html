<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Profil • LibraryOS</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f5ff;
    display:flex;
    color:#1b1464;
}

/* SIDEBAR */
.sidebar{
    width:280px;
    height:100vh;
    background:#17095e;
    color:white;
    position:fixed;
    left:0;
    top:0;
    padding:30px 20px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:28px;
    font-weight:800;
    margin-bottom:5px;
}

.logo-text{
    font-size:16px;
    opacity:.8;
    margin-bottom:40px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.menu a{
    text-decoration:none;
    color:white;
    padding:14px 16px;
    border-radius:12px;
    transition:.3s;
}

.menu a:hover,
.menu a.active{
    background:rgba(255,255,255,0.15);
}

/* MAIN */
.main{
    margin-left:280px;
    padding:40px;
    width:calc(100% - 280px);
}

.profile-card{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
    max-width:800px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:linear-gradient(135deg,#5b3df5,#9f56ff);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:32px;
    font-weight:bold;
    margin-bottom:15px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.box{
    background:#f3f4ff;
    padding:15px;
    border-radius:12px;
}

.box label{
    font-size:13px;
    opacity:.7;
}

.box p{
    margin:5px 0 0;
    font-weight:bold;
}

.btn{
    margin-top:20px;
    display:inline-block;
    background:linear-gradient(90deg,#5b3df5,#9f56ff);
    color:white;
    padding:10px 18px;
    border-radius:12px;
    text-decoration:none;
    border:none;
    cursor:pointer;
}

/* FORM */
form{
    margin-top:25px;
    background:#fafbff;
    padding:20px;
    border-radius:15px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
}
</style>
</head>

<body>

<!-- ✔ SIDEBAR (eklenmiş hali) -->
<div class="sidebar">

    <div>
        <div class="logo">📚 LibraryOS</div>
        <div class="logo-text">Üye Paneli</div>

        <div class="menu">

            <a href="{{ url_for('uye_dashboard') }}">
                🏠 <span>Ana Sayfa</span>
            </a>

            <a href="{{ url_for('uye_kitaplar') }}">
                📚 <span>Kitaplar</span>
            </a>

            <a href="{{ url_for('uye_profil') }}" class="active">
                👤 <span>Profil</span>
            </a>

            <a href="{{ url_for('logout') }}">
                🚪 <span>Çıkış</span>
            </a>

        </div>
    </div>

</div>

<!-- MAIN -->
<div class="main">

<div class="profile-card">

    <div class="avatar">
        {{ user.name[0] }}
    </div>

    <h2>{{ user.name }}</h2>
    <p>{{ user.email }}</p>

    <div class="info">

        <div class="box">
            <label>Üye ID</label>
            <p>{{ user.id }}</p>
        </div>

        <div class="box">
            <label>Telefon</label>
            <p>{{ user.phone }}</p>
        </div>

        <div class="box">
            <label>Ödünç Kitap Sayısı</label>
            <p>{{ book_count }}</p>
        </div>

        <div class="box">
            <label>Son Giriş</label>
            <p>{{ last_login }}</p>
        </div>

    </div>

    <button class="btn">✏️ Profili Düzenle</button>

    <form method="POST" action="{{ url_for('sifre_degistir') }}">

        <h3>🔒 Şifre Değiştir</h3>

        <input type="password" name="old_password" placeholder="Eski şifre" required>
        <input type="password" name="new_password" placeholder="Yeni şifre" required>

        <button class="btn" type="submit">Şifreyi Güncelle</button>
    </form>

</div>

</div>

</body>
</html>
